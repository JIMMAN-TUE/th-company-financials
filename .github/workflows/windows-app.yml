name: Windows app
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'docs/WINDOWS_APP.md'
      - '.github/workflows/windows-app.yml'

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[desktop]"
      - name: Bundle Python, application, and Chromium; run the frozen app self-test
        run: python scripts/build_windows_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: thfin-windows
          path: dist/thfin-windows.zip
          retention-days: 30
          if-no-files-found: error
